<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" href="/favicon.svg">
<title>A card from Andre</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:#111316;color:#f1f0eb;font:1.125rem/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:32px 28px 48px}
header{font-weight:700}
main{margin-top:44px}
#greeting{font-size:clamp(1.75rem,7vw,2.5rem);line-height:1.2;letter-spacing:-.035em;margin:0 0 32px;overflow-wrap:anywhere}
.eyebrow{color:#bfd6b8;font-size:.875rem;letter-spacing:.06em;margin:0 0 8px}
h1{font-size:clamp(2.5rem,10vw,3.625rem);line-height:1.08;letter-spacing:-.055em;overflow-wrap:anywhere;margin:0}
#note{color:#a7acb3;margin:14px 0 0;overflow-wrap:anywhere}
#note:empty{display:none}
#connection{border-top:1px solid #34373d;margin-top:28px;padding-top:24px;overflow-wrap:anywhere}
h2{color:#bfd6b8;font-size:.875rem;font-weight:500;letter-spacing:.035em;margin:0 0 8px}
#connection-note{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.button{display:inline-flex;justify-content:center;align-items:center;gap:10px;min-height:52px;padding:12px 18px;border:1px solid #bfd6b8;border-radius:10px;background:#bfd6b8;color:#111316;font-size:1rem;font-weight:500;text-decoration:none}
.linkedin{background:transparent;color:#bfd6b8;border-color:#596552}
.button:hover{filter:brightness(1.1)}
.button:focus-visible{outline:2px solid #f1f0eb;outline-offset:4px}
.linkedin svg{width:20px;height:20px;flex:none;fill:currentColor}
#state{color:#a7acb3;font-size:.875rem;margin:20px 0 0}
#state:empty{display:none}
@media(max-width:360px){body{padding-inline:22px}.actions{flex-direction:column}}
</style>
</head>
<body>
<header>[pet.]</header>
<main>
<p id="greeting">Hi!</p>
<p class="eyebrow">You met</p>
<h1 id="label">Andre Weiss</h1>
<p id="note">Loading your card…</p>
<section id="connection" hidden aria-labelledby="connection-heading">
<h2 id="connection-heading">How we connected</h2>
<p id="connection-note"></p>
</section>
<nav class="actions" aria-label="Stay connected">
<a class="button" id="open" hidden>Keep exploring ↗</a>
<a class="button linkedin" href="https://www.linkedin.com/in/axdreweiss" target="_blank" rel="noopener noreferrer" aria-label="Andre Weiss on LinkedIn (opens in a new tab)">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
LinkedIn
</a>
</nav>
<p id="state" role="status" aria-live="polite"></p>
</main>
<script>
const id=location.pathname.split('/').pop();let revision=null;
const connection=document.getElementById('connection'),connectionText=document.getElementById('connection-note');
async function update(){try{const r=await fetch('/api/card/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw Error('Card unavailable');const c=await r.json();if(c.revision!==revision){document.getElementById('greeting').textContent=c.recipient_name?'Hi, '+c.recipient_name+'!':'Hi!';document.getElementById('label').textContent=c.label;document.getElementById('note').textContent=c.note;connectionText.textContent=c.connection_note||'';connection.hidden=!c.connection_note;const a=document.getElementById('open');a.href=c.url;a.hidden=false;revision=c.revision;}document.getElementById('state').textContent='';}catch(e){document.getElementById('state').textContent='Reconnecting to the card host…';}}
update();setInterval(update,1500);
</script>
</body>
</html>
