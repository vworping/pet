<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PET / Card bench</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#111316;color:#f1f0eb;font:16px/1.5 system-ui;max-width:1100px;margin:auto;padding:30px}h1{font-size:46px;letter-spacing:-2px;margin:22px 0}p,small{color:#a7acb3}.grid{display:grid;grid-template-columns:280px 1fr;gap:32px}button,input,textarea{font:inherit;border:1px solid #34373d;background:#1c1e23;color:inherit;padding:12px;border-radius:8px}button{cursor:pointer}button.primary{background:#bfd6b8;color:#111316}label{display:block;margin:16px 0 5px}input,textarea{width:100%}a{color:#bfd6b8;overflow-wrap:anywhere}li{list-style:none;margin:10px 0}ul{padding:0}li button{width:100%;text-align:left}code{font-size:13px;overflow-wrap:anywhere}.note{padding:16px;border:1px solid #34373d;border-radius:8px}.actions{display:flex;gap:16px;align-items:center;margin:20px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style><body><strong>[pet.] / CARD BENCH</strong><h1>One link. A new conversation.</h1><p class="note">Local assignment test. Changes persist in SQLite and update the guest page live. This bench is not connected to the physical badge. Don’t write localhost links to your NFC stickers.</p><div class="grid"><aside><button id="new" class="primary">Create a test card</button><ul id="cards"></ul></aside><main><form id="edit" hidden><small id="identity"></small><label for="label">Page title</label><input id="label" maxlength="80" required><label for="note">Public note</label><textarea id="note" maxlength="280" rows="3"></textarea><label for="url">Public HTTPS destination</label><input id="url" type="url" required><div class="actions"><button class="primary">Assign this page</button><a id="open" target="_blank" rel="noreferrer">Open guest page ↗</a></div><p id="nfc"></p></form><p id="status" role="status">Choose or create a test card.</p></main></div><script>
const key=location.hash.slice(1);let selected,config;
const $=id=>document.getElementById(id);
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'X-PET-Admin':key,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const v=await r.json();if(!r.ok)throw Error(v.error);return v;}
const connectionLabel=document.createElement('label');connectionLabel.htmlFor='connection_note';connectionLabel.textContent='How we connected';
const connectionInput=document.createElement('input');connectionInput.id='connection_note';connectionInput.maxLength=80;connectionInput.placeholder='The answer from their Hello';
const connectionHint=document.createElement('small');connectionHint.textContent='Public on this card’s page. Badge transfer is not connected yet.';
$('edit').insertBefore(connectionLabel,$('url').previousElementSibling);connectionLabel.after(connectionInput,connectionHint);
function select(c){selected=c.id;$('edit').hidden=false;$('identity').textContent='Card '+c.id+' · Revision '+c.revision;for(const k of ['label','note','url','connection_note'])$(k).value=c[k]||'';$('open').href='/c/'+c.id;$('nfc').textContent=config.publicBase?'Permanent NFC URL: '+config.publicBase+'/c/'+c.id:'NFC programming waits for a permanent HTTPS host. The local guest link is only for this test.';}
async function list(){config=await api('/api/cards');$('cards').replaceChildren();for(const c of config.cards){const li=document.createElement('li'),b=document.createElement('button');b.textContent=c.label+' · '+c.id.slice(0,6);b.onclick=()=>select(c);li.append(b);$('cards').append(li);}}
$('new').onclick=async()=>{try{const c=await api('/api/cards','POST');await list();select(c);$('status').textContent='Stable address created. Edit the page, then watch its guest tab update.';}catch(e){$('status').textContent=e.message;}};
$('edit').onsubmit=async e=>{e.preventDefault();try{const c=await api('/api/card/'+selected,'POST',Object.fromEntries(['label','note','url','connection_note'].map(k=>[k,$(k).value.trim()])));await list();select(c);$('status').textContent='Assigned. The card URL is unchanged; its guest page updates within two seconds.';}catch(e){$('status').textContent=e.message;}};
list().catch(e=>$('status').textContent=e.message+'. Open the private owner URL saved by the server.');
</script></body></html>
